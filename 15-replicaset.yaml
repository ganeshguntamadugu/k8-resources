apiVersion: app/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
  labels:    # These are ReplicaSet labels
    project: expense
    enviroment: dev
    module: testing-rs
spec:
  replicas: 3
  selector:
    matchLables: # There labels are used to select the Pod and create replicas
      project: expense
      enviroment: dev
      module: testing-rs
# This is Pod definition
template:
  metadata:
    labels: # These are Pod labels
      project: expense
      enviroment: dev
      module: testing-rs
  spec:
    containers:
    - name: nginx-c
      image: nginx

