apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
spec:
  ClusterIP: None # Headless service there is no cluster IP
  selector:
    project: expense
    enviroment: dev
    module: testing-sfs
  ports:
    - name: gana-port
      protocol: TCP
      port: 3306  # service port
      targetPort: 3306 # container port
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-serv
spec:
  type: ClusterIP
  selector:
    project: expense
    enviroment: dev
    module: testing-sfs
  ports:
    - name: gana-port
      protocol: TCP
      port: 3306  # service port
      targetPort: 3306 # container port
---
# This is storage class
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mysql-sc
reclaimPolicy: Retain
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-sfs
  labels:   # These are StatefulSet labels
    project: expense
    enviroment: dev
    module: testing-sfs-1
spec:
  replicas: 3
  selector:   
    matchLabels:    # There labels are used to select the Pod and create replicas
      project: expense
      enviroment: dev
      module: testing-sfs 
  serviceName: "mysql-headless"  # This is the Headless service
  
  # minReadySeconds: 10 # by default is 0
  template:  # This is Pod definition
    metadata:
      labels:  # These are Pod labels
        project: expense
        enviroment: dev
        module: testing-sfs
    spec:
      # terminationGracePeriodSeconds: 10
      containers:
      - name: mysql-c
        image: ganeshguntamadugu/mysql:v1
        volumeMounts:  # Connects that volume to the container.
        - name: mysql-storage
          mountPath: /var/lib/mysql  # Where the volume is accessible inside the container.
  volumeClaimTemplates:
  - metadata:
      name: mysql-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "mysql-sc"
      resources:
        requests:
          storage: 2Gi