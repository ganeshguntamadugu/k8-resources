apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 20Gi
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0f7ccd81268654c0b
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static-claim
spec:
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static-pod
  labels:
    purpose: ebs-static-testing
spec:
  containers:
  - name: ebs-static-pod-c
    image: nginx
    volumeMounts: # Connects that volume to the container.
    - name: expense-storage
      mountPath: /usr/share/nginx/html # Where the volume is accessible inside the container.
  nodeSelector: # To define in which zone the Pod should create
    topology.kubernetes.io/zone: us-east-1f
  volumes: # Defines the volume inside the Pod.
  - name: expense-storage
    persistentVolumeClaim:
      claimName: ebs-static-claim
---
apiVersion: v1
kind: Service
metadata:
  name: ebs-static
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-static-testing
  ports:
    - name: ebs-static-port
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30081