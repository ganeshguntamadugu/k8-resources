apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-06c6a61e8863a30ef
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-static-claim
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: efs-static
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-static-pod
  labels:
    purpose: efs-static-testing
spec:
  containers:
  - name: efs-static-pod-c
    image: nginx
    volumeMounts: # Connects that volume to the container.
    - name: expense-storage-efs
      mountPath: /usr/share/nginx/html # Where the volume is accessible inside the container.
  # nodeSelector: # To define in which zone the Pod should create
  #   topology.kubernetes.io/zone: us-east-1f
  volumes: # Defines the volume inside the Pod.
  - name: expense-storage-efs
    persistentVolumeClaim:
      claimName: efs-static-claim
---
apiVersion: v1
kind: Service
metadata:
  name: efs-static
spec:
  type: LoadBalancer
  selector:
    purpose: efs-static-testing
  ports:
    - name: efs-static-port
      protocol: TCP
      port: 80 # service port
      targetPort: 80  # container port
      nodePort: 30081      